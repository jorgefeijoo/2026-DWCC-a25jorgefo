<!doctype html>
<html lang="gl">

<head>
    <title>Gallery</title>
    <script defer src="script.js"></script>
    <meta charset="utf-8" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font: 75%/120% sans-serif;
        }

        #largeImg {
            border: solid 1px #ccc;
            width: 550px;
            height: 400px;
            padding: 5px;
        }

        #thumbs a {
            border: solid 1px #ccc;
            width: 100px;
            height: 100px;
            padding: 3px;
            margin: 2px;
            float: left;
        }

        #thumbs a:hover {
            border-color: #ff9900;
        }

        #thumbs li {
            list-style: none;
        }

        #thumbs {
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>
    <p>
        <img id="largeImg" src="./images/img1-lg.jpg" alt="Large image" />
    </p>

    <ul id="thumbs">
        <!-- el navegador muestra un tooltip (ya viene integrado) con el texto del atributo "title" al pasar el ratón sobre él -->
        <li>
            <a href="./images/img2-lg.jpg" title="Image 2"><img src="./images/img2-thumb.jpg" alt="img2" /></a>
        </li>
        <li>
            <a href="./images/img3-lg.jpg" title="Image 3"><img src="./images/img3-thumb.jpg" alt="img3" /></a>
        </li>
        <li>
            <a href="./images/img4-lg.jpg" title="Image 4"><img src="./images/img4-thumb.jpg" alt="img4" /></a>
        </li>
        <li>
            <a href="./images/img5-lg.jpg" title="Image 5"><img src="./images/img5-thumb.jpg" alt="img5" /></a>
        </li>
        <li>
            <a href="./images/img6-lg.jpg" title="Image 6"><img src="./images/img6-thumb.jpg" alt="img6" /></a>
        </li>
    </ul>
</body>

</html>
